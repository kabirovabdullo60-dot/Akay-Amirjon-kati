<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./output.css">
</head>
<body>
    <div class="w-full h-1 bg-[#00C853]"></div>

<header class="w-full bg-white border-b border-gray-200 antialiased font-sans">
  <div class="max-w-[1200px] mx-auto px-4 w-full">
    
    <div class="hidden lg:flex justify-between items-stretch h-12 border-b border-gray-100 text-xs xl:text-sm">
      <div class="flex items-stretch">
        <a href="#" class="flex items-center gap-1 mr-6 shrink-0">
          <img src="./images/Logo (11).png" alt="Dily.ru Логотип" class="w-24 h-6 object-contain" />
        </a>
        <nav class="flex items-stretch">
          <a href="#" class="flex items-center px-4 text-gray-600 hover:text-gray-900 transition-colors font-medium">
            Доска объявлений
          </a>
          <a href="#" class="flex items-center px-4 text-gray-600 hover:text-gray-900 transition-colors font-medium">
            Сервисный центр
          </a>
          <a href="#" class="flex items-center px-5 bg-[#B9F6CA] text-gray-800 font-semibold transition-colors">
            Интернет-магазин Dily.ru
          </a>
          <a href="#" class="flex items-center px-4 text-gray-600 hover:text-gray-900 transition-colors font-medium">
            Скупка
          </a>
        </nav>
      </div>

      <div class="flex items-center gap-6">
        <button class="flex items-center gap-1 text-gray-500 hover:text-gray-800 transition-colors font-medium">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 text-[#00C853]">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
          </svg>
          <span>Москва</span>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-3 h-3 text-gray-400 ml-0.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
          </svg>
        </button>
        
        <a href="#" class="flex items-center gap-1.5 text-gray-700 hover:text-gray-900 transition-colors font-medium">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 text-[#00C853]">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
          </svg>
          <span>Вход/ регистрация</span>
        </a>
      </div>
    </div>

    <div class="py-3 lg:py-4 flex flex-col md:flex-row items-center justify-between gap-4">
      
      <div class="w-full md:w-auto flex items-center justify-between lg:justify-start gap-4">
        <div class="flex items-center gap-3 lg:hidden">
          <a href="#" class="shrink-0">
            <img src="./images/Logo (11).png" alt="Dily.ru Логотип Мобильный" class="w-20 h-5 object-contain" />
          </a>
        </div>

        <button class="flex items-center gap-2 bg-transparent text-[#00C853] hover:opacity-80 font-semibold text-sm md:text-base py-1 px-2 rounded-lg transition-all">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
          <span>Каталог товаров</span>
        </button>

        <a href="#" class="hidden sm:flex items-center gap-2 text-gray-600 hover:text-gray-900 transition-colors text-sm font-medium">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5 text-gray-400">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 0 1-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h1.125c.621 0 1.129-.504 1.129-1.125V11.25c0-.442-.18-.846-.47-1.13l-2.06-2.06a1.124 1.124 0 0 0-.795-.33H15M9 18.75h6m0 0V11.25m0-4.5V4.5A2.25 2.25 0 0 0 12.75 2.25h-4.5A2.25 2.25 0 0 0 6 4.5v2.25m3 3h.008v.008H9V9.75Zm.563 0h.008v.008H9.563V9.75Zm0-2.25h.008v.008H9.563V7.5Zm3.375 2.25h.008v.008h-.008V9.75Zm-.562 0h.008v.008h-.008V9.75Zm0-2.25h.008v.008h-.008V7.5Z" />
          </svg>
          <span class="whitespace-nowrap">Доставка и оплата</span>
        </a>
      </div>

      <form class="w-full md:flex-1 max-w-xl flex items-stretch bg-gray-100 rounded-full overflow-hidden border border-transparent focus-within:border-gray-300 transition-all">
        <div class="pl-4 flex items-center text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-51.97-51.97m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.608 10.608Z" />
          </svg>
        </div>
        <input 
          type="text" 
          placeholder="Я хочу купить" 
          class="w-full bg-transparent px-3 py-2 text-sm text-gray-800 placeholder-gray-400 focus:outline-none" 
        />
        <button type="submit" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium px-6 text-sm transition-colors rounded-r-full">
          Найти
        </button>
      </form>

      <div class="w-full md:w-auto flex items-center justify-between md:justify-end gap-6 shrink-0 border-t md:border-none pt-2 md:pt-0">
        <a href="#" class="text-sm font-medium text-gray-600 hover:text-gray-900 transition-colors">
          Поддержка
        </a>

        <div class="flex items-center gap-4 text-gray-500">
          <button class="relative p-1 hover:text-gray-800 transition-colors" aria-label="Сравнение">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-6 h-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12h16.5m-16.5 3.75h16.5M3.75 19.5h16.5M5.625 4.5h12.75a1.875 1.875 0 0 1 0 3.75H5.625a1.875 1.875 0 0 1 0-3.75Z" />
            </svg>
            <span class="absolute top-0 right-0 w-2.5 h-2.5 bg-[#00C853] rounded-full border border-white"></span>
          </button>

          <button class="p-1 hover:text-gray-800 transition-colors" aria-label="Избранное">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-6 h-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
            </svg>
          </button>

          <button class="p-1 hover:text-gray-800 transition-colors" aria-label="Корзина">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-6 h-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
            </svg>
          </button>
        </div>
      </div>

    </div>
  </div>
</header>


</body>
</html>
